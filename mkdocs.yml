site_name: Goracle
site_description: 'Открытая база знаний по Go — от первых программ до устройства среды выполнения и архитектуры'
site_author: '@venexene'
repo_url: https://github.com/venexene/goracle
edit_uri: edit/main/
site_dir: site

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Светлая тема
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - md_in_html
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - footnotes
  - toc:
      permalink: true

extra_javascript:
  - javascripts/katex.js
  - javascripts/legacy-anchors.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css

plugins:
  - search:
      lang: ru

nav:
  - Главная: index.md
  - Начать обучение:
      - Маршруты: learning-paths.md
      - Практикум: practice.md
      - Словарь: glossary.md
  - Основы информатики:
      - Обзор: computer-science/index.md
      - Карта конкурентности: computer-science/concurrency-map.md
      - Алгоритмы и структуры данных: computer-science/Алгоритмы и структуры данных/algorithms-and-data-structures.md
      - Параллельность и конкурентность: computer-science/Параллельность и конкрентность/concurrency.md
      - Шаблоны конкурентного кода:
          - Учебная глава: computer-science/Конкурентные паттерны в Go/concurrency-patterns.md
          - Полный справочник: computer-science/Конкурентные паттерны в Go/reference.md
      - Компьютерные сети: computer-science/Компьютерные сети/computer-networks.md
      - Компьютерные системы: computer-science/Компьютерные системы/computer-systems.md
  - Архитектура и проектирование:
      - Обзор: architecture/index.md
      - Принципы программирования: architecture/Принципы программирования/programming-principles.md
      - ООП в Go: architecture/ООП/oop.md
      - Чистая архитектура: architecture/Чистая архитектура/clean-architecture.md
      - Микросервисная архитектура: architecture/Микросервисная архитектура/microservices.md
      - HTTP:
          - Учебный маршрут: architecture/HTTP/http.md
          - Протокол: architecture/HTTP/protocol.md
          - Сервер net/http: architecture/HTTP/server.md
          - Клиент и транспорт: architecture/HTTP/client.md
          - Безопасность и эксплуатация: architecture/HTTP/security-and-operations.md
          - Полный справочник: architecture/HTTP/reference.md
      - gRPC: architecture/gRPC/index.md
  - Детали языка:
      - Обзор: go-details/index.md
      - Типы данных: go-details/Типы данных в Go/types.md
      - Массивы и срезы: go-details/Массивы и срезы в Go/arrays-and-slices.md
      - Мапы: go-details/Мапы в Go/maps.md
      - Строки: go-details/Строки в Go/strings.md
      - Интерфейсы: go-details/Интерфейсы в Go/interfaces.md
      - Каналы: go-details/Каналы в Go/channels.md
      - Defer: go-details/Defer в Go/defer.md
      - Замыкания: go-details/Замыкания в Go/closures.md
      - Ошибки: go-details/Ошибки в Go/errors.md
      - Контекст: go-details/Контекст в Go/context.md
      - Синхронизация:
          - Учебный маршрут: go-details/Синхронизация в Go/synchronization.md
          - Атомарные операции и модель памяти: go-details/Синхронизация в Go/atomics-and-memory-model.md
          - Блокировки: go-details/Синхронизация в Go/locks.md
          - Координация: go-details/Синхронизация в Go/coordination.md
          - Конкурентные контейнеры: go-details/Синхронизация в Go/concurrent-containers.md
          - Полный справочник: go-details/Синхронизация в Go/reference.md
      - Обобщённый код: go-details/Дженерики в Go/generics.md
  - Инструменты и практика:
      - Обзор: tools-and-practice/index.md
      - Тестирование: tools-and-practice/Тестирование в Go/testing.md
      - Базы данных в Go:
          - Учебный маршрут: tools-and-practice/Базы данных в Go/db.md
          - SQL и моделирование: tools-and-practice/Базы данных в Go/sql-and-modeling.md
          - database/sql: tools-and-practice/Базы данных в Go/database-sql.md
          - PostgreSQL и производительность: tools-and-practice/Базы данных в Go/postgres-and-performance.md
          - Миграции и тестирование: tools-and-practice/Базы данных в Go/migrations-and-testing.md
          - Полный справочник: tools-and-practice/Базы данных в Go/reference.md
      - Журналирование: tools-and-practice/Логирование в Go/logging.md
  - Устройство Go:
      - Обзор: go-fundamentals/index.md
      - Компиляция и запуск: go-fundamentals/Компиляция и запуск Go/compilation-and-startup.md
      - Планировщик Go:
          - Учебный маршрут: go-fundamentals/Планировщик Go/scheduler.md
          - ОС, процессы и горутины: go-fundamentals/Планировщик Go/os-basics.md
          - Модель GMP: go-fundamentals/Планировщик Go/gmp.md
          - Диагностика: go-fundamentals/Планировщик Go/diagnostics.md
          - Полный справочник: go-fundamentals/Планировщик Go/reference.md
      - Память в Go:
          - Модель и диагностика: go-fundamentals/Память в Go/memory.md
          - Устройство Go 1.27: go-fundamentals/Память в Go/runtime-reference.md
      - Анализ времени жизни:
          - Практическое руководство: go-fundamentals/Escape Analysis в Go/escape-analysis.md
          - Устройство компилятора: go-fundamentals/Escape Analysis в Go/compiler-reference.md
      - Сборщик мусора:
          - Модель и диагностика: go-fundamentals/Сбощик мусора в Go/garbage-collector.md
          - Устройство Go 1.27: go-fundamentals/Сбощик мусора в Go/runtime-reference.md
      - Встраивание функций:
          - Практическое руководство: go-fundamentals/Инлайн в Go/inlining.md
          - Устройство компилятора: go-fundamentals/Инлайн в Go/compiler-reference.md
      - Выравнивание: go-fundamentals/Выравнивание в Go/alignment.md
  - О проекте:
      - Стандарт материала: project/content-standard.md
      - Лист рецензирования: project/review-checklist.md
